name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Install dependencies
              run: |
                  python -m pip install --U pip wheel
                  pip install -e ".[dev]"
            - name: Quick CLI smoke test
              run: |
                  units-convert --help || (echo "CLI smoke test failed" && exit 1)
            - name: Run tests
              run: pytest -q
